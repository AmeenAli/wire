name: tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install PyTorch (CPU) and the test tools
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest safetensors "transformers==5.7.0" accelerate
      - name: CPU check
        run: python reproduce/cpu_check.py
      - name: Tests
        run: pytest -q
